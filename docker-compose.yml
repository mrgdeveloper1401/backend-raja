services:
  db:
    container_name: postgres
    image: docker.arvancloud.ir/postgres:18-alpine
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/
    restart: always
    env_file: env_folder/db.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      retries: 2
      start_period: 10s
      timeout: 5s
    mem_limit: 1024m

  redis:
    container_name: redis
    restart: always
    image: docker.arvancloud.ir/redis:8-alpine
    entrypoint: >
      redis-server
      --loglevel warning
      --appendonly no
      --save ""
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      retries: 2
      start_period: 10s
      timeout: 5s
    mem_limit: 300m

  app:
    container_name: django
    volumes:
      - static_files:/app/staticfiles
    build:
      context: .
      dockerfile: dockerfile/prod/django/Dockerfile
    restart: always
    expose:
      - 8000
    env_file: env_folder/.env
    depends_on:
      bouncer:
        condition: service_started
      redis:
        condition: service_healthy
    mem_limit: 1024m

  nginx:
    container_name: nginx
    restart: always
    build:
      context: dockerfile/prod/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    expose:
      - 80
      - 443
    depends_on:
      app:
        condition: service_started
    volumes:
      - static_files:/var/www/static
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ssl:/etc/ssl:ro
    mem_limit: 300m

  bouncer:
    container_name: bouncer
    restart: always
    image: docker.arvancloud.ir/edoburu/pgbouncer
    env_file: env_folder/bouncer.env
    expose:
      - 6432
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 200m

  celery:
    container_name: celery
    restart: always
    build:
      context: .
      dockerfile: dockerfile/prod/django/Dockerfile
    env_file:
      - env_folder/.env
    entrypoint: "celery -A core worker -l INFO"
    depends_on:
      app:
        condition: service_started
    mem_limit: 1024m

volumes:
  postgres_data:
  static_files:
