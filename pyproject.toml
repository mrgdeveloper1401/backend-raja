[project]
name = "reserv-ticket-raja"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohammad goodarzi", email = "mysum325g@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "celery[redis]>=5.6.3",
    "django-bolt>=0.12.0",
    "django-debug-toolbar>=8.0.0",
    "django-json-widget>=2.1.1",
    "django-redis>=7.0.0",
    "flower>=2.2.0",
    "hiredis>=3.5.0",
    "httpx>=0.28.1",
    "ipython>=9.17.1",
    "jdatetime>=6.1.1",
    "msgpack>=1.2.4",
    "patchright>=1.64.3",
    "playwright>=1.64.1",
    "tenacity>=9.2.1",
]

[project.scripts]
reserv-ticket-raja = "reserv_ticket_raja:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery[redis]>=5.6.3",
    "ipdb>=0.13.13",
    "psycopg[c,pool]>=3.3.6",
    "python-decouple>=3.8",
]
