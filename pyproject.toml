[project]
name = "backend-raja"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohammad goodarzi", email = "m.goodarzi606@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "celery[redis]>=5.6.3",
    "django-bolt>=0.13.0",
    "django-celery-task-view>=0.1.1",
    "django-debug-toolbar>=8.0.0",
    "django-json-widget>=2.1.1",
    "django-redis>=7.0.0",
    "flower>=2.2.0",
    "hiredis>=3.5.0",
    "httpx>=0.28.1",
    "ipdb>=0.13.13",
    "ipython>=9.17.1",
    "jdatetime>=6.1.1",
    "msgpack>=1.2.4",
    "patchright>=1.64.3",
    "playwright>=1.64.1",
    "psycopg[c,pool]>=3.3.9",
    "pypasser[speech,vision]>=1.1.0",
    "python-decouple>=3.8",
    "tenacity>=9.2.1",
]

[project.scripts]
backend-raja = "backend_raja:main"

[[tool.uv.index]]
url = "https://package-mirror.liara.ir/repository/pypi/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
