[project]
name = "reserv-ticket-raja"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohammad goodarzi", email = "mysum325g@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django-bolt>=0.12.0",
    "ipython>=9.17.1",
]

[project.scripts]
reserv-ticket-raja = "reserv_ticket_raja:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery[redis]>=5.6.3",
    "ipdb>=0.13.13",
    "psycopg[c,pool]>=3.3.6",
    "python-decouple>=3.8",
]
