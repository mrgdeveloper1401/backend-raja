services:
  db:
    container_name: postgres
    image: docker.arvancloud.ir/postgres:18-alpine
    expose:
      - 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    env_file: ".env"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME" ]
      interval: 30s
      retries: 2
      start_period: 10s
      timeout: 5s

  redis:
    container_name: redis
    restart: always
    image: docker.arvancloud.ir/redis:8-alpine
    entrypoint: >
      redis-server
      --loglevel warning
      --appendonly no
      --save ""
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    expose:
      - 6379
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      retries: 2
      start_period: 10s
      timeout: 5s

volumes:
  postgres_data: